<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendEase</title>
    <link rel="stylesheet" href="Attendance.css">
</head>
<body>

<div class="container">

    <header>
        <h1>Attendance</h1>
        <p>Your Smart Attendance Dashboard</p>
    </header>

    <section class="stats">
        <div class="card">
            <h3>Attendance</h3>
            <h2 id="percentage">0%</h2>
        </div>

        <div class="card">
            <h3>Present</h3>
            <h2 id="present">0</h2>
        </div>

        <div class="card">
            <h3>Absent</h3>
            <h2 id="absent">0</h2>
        </div>

        <div class="card">
            <h3>Total Classes</h3>
            <h2 id="total">0</h2>
        </div>
    </section>

    <section class="calendar">

        <div class="calendar-header">
            <button id="prev">❮</button>
            <h2 id="month"></h2>
            <button id="next">❯</button>
        </div>

        <div class="weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div id="days" class="days"></div>

    </section>

    <section class="attendance-panel">

        <h2>Mark Attendance</h2>

        <p id="selectedDate">Select a date</p>

        <div class="buttons">
            <button class="present-btn" onclick="markAttendance('Present')">
                Present
            </button>

            <button class="absent-btn" onclick="markAttendance('Absent')">
                Absent
            </button>

            <button class="holiday-btn" onclick="markAttendance('Holiday')">
                Holiday
            </button>

            <button class="clear-btn" onclick="markAttendance('Clear')">
                Clear
            </button>
        </div>

    </section>

</div>

<script src="Attendance.js"></script>
</body>
</html>
