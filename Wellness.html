<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodMate - Mood Tracker</title>
    <link rel="stylesheet" href="Wellness.css">
</head>
<body>

<div class="container">

    <header>
        <h1>🌈 MoodMate</h1>
        <p>Your daily mood and wellness journal</p>
    </header>

    <section class="welcome">
        <h2>Hello! How are you feeling today?</h2>
        <p>Take a moment for yourself.</p>
    </section>

    <section class="mood-section">
        <h2>Choose your mood</h2>

        <div class="moods">
            <button onclick="selectMood('Happy','😊')">
                😊<span>Happy</span>
            </button>

            <button onclick="selectMood('Calm','😌')">
                😌<span>Calm</span>
            </button>

            <button onclick="selectMood('Okay','😐')">
                😐<span>Okay</span>
            </button>

            <button onclick="selectMood('Sad','😔')">
                😔<span>Sad</span>
            </button>

            <button onclick="selectMood('Stressed','😣')">
                😣<span>Stressed</span>
            </button>
        </div>

        <p id="selectedMood">No mood selected yet.</p>
    </section>

    <section class="journal">
        <h2>Write your thoughts ✍️</h2>

        <textarea id="thoughts"
        placeholder="What's on your mind today?"></textarea>

        <button class="save-btn" onclick="saveMood()">
            Save Today's Mood
        </button>

        <p id="message"></p>
    </section>

    <section class="stats">
        <h2>Your Mood Summary</h2>
        <div id="summary">
            No entries yet.
        </div>
    </section>

    <section class="history">
        <h2>📅 Mood History</h2>
        <div id="historyList"></div>
    </section>

    <footer>
        <p>Made with care 💜 | MoodMate</p>
        <p>Your feelings matter.</p>
    </footer>

</div>

<script src="Wellness.js"></script>
</body>
</html>
