<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMI Remind</title>
    <link rel="stylesheet" href="Reminder.css">
</head>
<body>

<div class="container">

    <header>
        <div class="logo">LUMI<span>.</span></div>
        <p class="subtitle">A little help with your day</p>
    </header>

    <section class="welcome">
        <span class="tag">YOUR PERSONAL PLANNER ✨</span>
        <h1>Stay on track, effortlessly.</h1>
        <p>Remember what matters. One task at a time.</p>
        <h3 id="todayDate"></h3>
    </section>

    <section class="stats">

        <div class="stat">
            <span>TOTAL</span>
            <h2 id="totalCount">0</h2>
        </div>

        <div class="stat">
            <span>UPCOMING</span>
            <h2 id="upcomingCount">0</h2>
        </div>

        <div class="stat">
            <span>COMPLETED</span>
            <h2 id="completedCount">0</h2>
        </div>

    </section>

    <section class="form-card">

        <h2>＋ Create a reminder</h2>

        <form id="reminderForm">

            <label>Reminder title</label>
            <input type="text" id="title"
                placeholder="e.g. Complete Physics assignment"
                required>

            <label>Description</label>
            <textarea id="description"
                placeholder="Add some details..."></textarea>

            <div class="form-row">

                <div>
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>

                <div>
                    <label>Time</label>
                    <input type="time" id="time" required>
                </div>

            </div>

            <button type="submit" class="add-btn">
                Save reminder →
            </button>

        </form>

        <button id="notificationBtn" class="notification-btn">
            🔔 Enable browser notifications
        </button>

        <p id="message"></p>

    </section>

    <section class="reminders">

        <div class="section-heading">
            <h2>Your reminders</h2>
            <span id="taskCount">0 tasks</span>
        </div>

        <div class="filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="upcoming">Upcoming</button>
            <button class="filter" data-filter="completed">Completed</button>
        </div>

        <div id="reminderList"></div>

    </section>

    <footer>
        <p>Made with care 💜 | LUMI Remind</p>
        <p>Make time for what matters.</p>
    </footer>

</div>

<script src="Reminder.js"></script>
</body>
</html>
